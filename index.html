<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMatrix</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

const chars =
"アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const fontSize = 16;
let columns = Math.floor(canvas.width / fontSize);

const trailLength = 75;

let drops = [];
let trails = [];

function init() {
    columns = Math.floor(canvas.width / fontSize);

    drops = [];
    trails = [];

    for (let i = 0; i < columns; i++) {
        drops[i] = Math.floor(Math.random() * -100);
        trails[i] = [];
    }
}

init();

window.addEventListener("resize", init);

function randomChar() {
    return chars[Math.floor(Math.random() * chars.length)];
}

function draw() {

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < columns; i++) {

        const x = i * fontSize;

        const char = randomChar();

        trails[i].unshift({
            char: char,
            y: drops[i]
        });

        if (trails[i].length > trailLength) {
            trails[i].pop();
        }

        for (let j = 0; j < trails[i].length; j++) {

            const item = trails[i][j];
            const y = item.y * fontSize;

            if (y < 0 || y > canvas.height + fontSize)
                continue;

            if (j === 0) {

                ctx.fillStyle = "#FFFFFF";

            } else {

                const green = Math.max(
                    30,
                    255 - Math.floor((j / trailLength) * 170)
                );

                ctx.fillStyle = `rgb(0,${green},0)`;
            }

            ctx.fillText(item.char, x, y);
        }

        drops[i]++;

        if (
            drops[i] * fontSize > canvas.height + trailLength * fontSize &&
            Math.random() > 0.975
        ) {
            drops[i] = Math.floor(Math.random() * -50);
            trails[i] = [];
        }
    }
}

setInterval(draw, 33);
</script>

</body>
</html>
